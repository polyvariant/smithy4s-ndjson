pull_request_rules:
- name: merge scala-steward's PRs
  conditions:
  - author=scala-steward
  - or:
    - body~=labels:.*early-semver-patch
    - body~=labels:.*early-semver-minor
  - status-success=Test (ubuntu-22.04, 3, temurin@11, rootJVM)
  actions:
    merge: {}
- name: Label core PRs
  conditions:
  - files~=^modules/core/
  actions:
    label:
      add:
      - core
      remove: []
- name: Label http4s PRs
  conditions:
  - files~=^modules/http4s/
  actions:
    label:
      add:
      - http4s
      remove: []
- name: Label protocol PRs
  conditions:
  - files~=^modules/protocol/
  actions:
    label:
      add:
      - protocol
      remove: []
- name: Label testfixtures PRs
  conditions:
  - files~=^modules/testfixtures/
  actions:
    label:
      add:
      - testfixtures
      remove: []
